# Core library crate for the fountain_transfer GitHub project.

[package]
name = "fountain_transfer_core"
version = "2.0.0"
edition = "2024"
authors = ["Shenghao Yang"]
license = "MIT"
description = "Library-first transfer facade over RaptorQ, Raptor10, and optional BHP codecs"
readme = "README.md"
repository = "https://github.com/shhyang/fountain_transfer"
documentation = "https://github.com/shhyang/fountain_transfer/tree/main/fountain_transfer_core"
keywords = ["fountain-code", "erasure-coding", "file-transfer", "raptor-code", "fec"]
categories = ["algorithms", "encoding", "network-programming"]

[features]
default = ["raptor-q", "raptor-10"]
raptor-q = ["dep:fountain_scheme"]
raptor-10 = ["dep:fountain_scheme"]
# Optional BHP (BinaryHdpcPi); not enabled by default. Requires fountain_scheme >= 2.2.
bhp = ["dep:fountain_scheme"]

[dependencies]
# Local tip: monorepo SysDec resident / cache-until-K APIs (not yet on crates.io 2.1).
fountain_engine = { path = "../../../erasure_coding_lib/fountain_engine" }
fountain_utility = { path = "../../../erasure_coding_lib/fountain_utility" }
fountain_operators = { path = "../../../erasure_coding_lib/fountain_operators", default-features = false }
fountain_scheme = { path = "../../../erasure_coding_lib/fountain_scheme", optional = true }
